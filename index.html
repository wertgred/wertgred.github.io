*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#222;font:15px Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{max-width:1440px;margin:auto;padding:28px 48px;display:flex;justify-content:space-between;border-bottom:1px solid #d9d8d3;align-items:center}.brand{font-weight:700;letter-spacing:-.5px}header a{color:#555;text-decoration:none;font-size:13px}main{max-width:1440px;margin:auto;padding:65px 48px 70px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:44px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#73736e;margin:0 0 18px}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-3px;font-weight:500;margin:0 0 17px}.description{color:#696963;line-height:1.6;margin:0}.total{font-size:12px;color:#73736e;white-space:nowrap;padding-bottom:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:20px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid transparent;background:transparent;padding:9px 15px;border-radius:3px;color:#666}.filter.active{background:#252622;color:white}.filter:hover{border-color:#bbb}.count{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 24px}.card{display:block;border:0;padding:0;background:transparent;text-align:left;color:inherit;width:100%}.image-wrap{position:relative;aspect-ratio:1.5;background:#383838;overflow:hidden;border-radius:3px}.image-wrap img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}.card:hover img{transform:scale(1.025)}.badge{position:absolute;bottom:12px;right:12px;background:#202020ce;color:#fff;font-size:11px;padding:6px 9px;border-radius:2px}.details{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:12px}.details.nameless{display:none}.details h2{font-size:16px;font-weight:500;margin:0}.details span{font-size:11px;color:#777}.card:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #586652;outline-offset:5px}footer{border-top:1px solid #d9d8d3;padding:25px 0;margin-top:65px;color:#777;font-size:12px;display:flex;justify-content:space-between}dialog{border:0;padding:0;background:#191a18;color:#eee;width:min(1200px,95vw);max-width:1200px;max-height:95dvh;border-radius:4px}dialog::backdrop{background:#111d;backdrop-filter:blur(4px)}.viewer-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.viewer-head h2{font-size:18px;font-weight:500;margin:0}.viewer-head p{margin:6px 0 0;color:#999;font-size:12px}.icon{border:1px solid #555;background:#262724;color:#fff;width:40px;height:40px;border-radius:3px;font-size:24px}.stage{height:min(62dvh,690px);position:relative;display:flex;align-items:center;justify-content:center;background:#303030}.stage img{width:100%;height:100%;object-fit:contain;display:block}.image-pan{position:absolute;inset:0;overflow:auto}.zoom-image{display:block;border:0;padding:0;background:transparent;width:100%;height:100%;cursor:zoom-in}.zoom-image.zoomed{width:250%;height:250%;cursor:grab}.zoom-image.dragging{cursor:grabbing}.zoom-image img{user-select:none;-webkit-user-drag:none}.zoom-image:focus-visible{outline:2px solid #ddd;outline-offset:-3px}.prev,.next{z-index:1}.brand{max-width:75%;line-height:1.4}.prev,.next{position:absolute;top:50%;transform:translateY(-50%);background:#181818c9}.prev{left:16px}.next{right:16px}.viewer-bottom{padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs button{padding:0;border:2px solid transparent;background:#333;border-radius:2px;width:75px;height:50px;flex-shrink:0;opacity:.6}.thumbs button.selected{border-color:#eee;opacity:1}.thumbs img{height:100%;width:100%;object-fit:contain}.position{font-size:12px;color:#aaa;white-space:nowrap}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:22px 25px}main{padding:45px 25px}.intro{align-items:start;gap:20px}.total{display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:28px}h1{letter-spacing:-1.5px}.toolbar{align-items:start;flex-direction:column;gap:10px}.filter{padding:8px 11px}.viewer-head{padding:16px}.viewer-bottom{padding:16px}.stage{height:52dvh}footer{gap:15px}.description{max-width:290px}}

</style></head><header><div class="brand">Wertgred - 3D Model Portfolio</div><a href="#work">Selected work ↗</a></header><main id="work"><section class="intro"><div><p class="eyebrow">Model collection</p><h1>Selected work.</h1><p class="description">Vehicles, aircraft, ships, props, and Astra Invictus concepts.</p></div></section><div class="toolbar"><nav aria-label="Filter by category" class="filters"></nav><span aria-live="polite" class="count">25 models</span></div><div class="grid"></div><footer><span>Wertgred - 3D Model Portfolio</span></footer></main><dialog aria-labelledby="model-title"><div class="viewer-head"><div><h2 id="model-title"></h2><p id="model-category"></p></div><button aria-label="Close viewer" class="icon close">×</button></div><div class="stage"><div class="image-pan"><button aria-label="Zoom into image" aria-pressed="false" class="zoom-image"><img alt="" draggable="false" id="full-image"/></button></div><button aria-label="Previous view" class="icon prev">‹</button><button aria-label="Next view" class="icon next">›</button></div><div class="viewer-bottom"><div aria-label="Model views" class="thumbs"></div><span aria-live="polite" class="position"></span></div></dialog>
<script>const models=[
{"name":"AH-64","category":"Aircraft","images":["AH64_1.png","AH64_2.png"]},
{"name":"Dodge Charger","category":"Vehicles","images":["Charger_1.png","Charger_2.png","Charger_3.png"]},
{"name":"Delivery truck","category":"Vehicles","images":["DT_1.png","DT_2.png"]},
{"name":"1990 Dodge Spirit","category":"Vehicles","images":["Dart_1.png","Dart_2.png","Dart_3.png"]},
{"name":"1990 Ford F150","category":"Vehicles","images":["F150_1.png","F150_2.png","F150_3.png"]},
{"name":"Fletcher Class Destroyer","category":"Naval","images":["Fletcher_1.png","Fletcher_2.png","Fletcher_3.png"]},
{"name":"Admiral Gorshkov-class Frigate","category":"Naval","images":["Gorshkov_1.png","Gorshkov_2.png","Gorshkov_3.png","Gorshkov_4.png"]},
{"name":"Kamaz 4310","category":"Vehicles","images":["Kamaz_1.png","Kamaz_2.png"]},
{"name":"Mi-26","category":"Aircraft","images":["MI26_1.png","MI26_2.png"]},
{"name":"Lithuanian Patrol 24 WP","category":"Naval","images":["PatrolBoat_1.png","PatrolBoat_2.png","PatrolBoat_3.png"]},
{"name":"Rolls Royce Silver Spirit","category":"Vehicles","images":["RRSS_1.png","RRSS_2png.png"]},
{"name":"Remington Shotgun","category":"Props","images":["Remmy_1.png","Remmy_2.png"]},
{"name":"Su-57","category":"Aircraft","images":["SU57_1.png","SU57_2.png","SU57_3.png"]},
{"name":"Tools","category":"Props","images":["Tools1.png"]},
{"name":"UH-60","category":"Aircraft","images":["UH60_1.png","UH60_2.png"]},
{"name":"Lada 2107","category":"Vehicles","images":["lada.png"]},
{"name":"Antonov An-2","category":"Aircraft","images":["AN2_1.png","AN2_2.png","AN2_3.png"]},
{"name":"HSTV-L","category":"Vehicles","images":["HSTVL_1.png","HSTVL_2.png"]},
{"name":"","category":"Astra Invictus","images":["AstraBase_1.png"]},
{"name":"","category":"Astra Invictus","images":["AstraShip_1.png"]},
{"name":"","category":"Astra Invictus","images":["AstraFighter_1.png"]},
{"name":"","category":"Astra Invictus","images":["AstraFighter_2.png"]},
{"name":"","category":"Astra Invictus","images":["AstraCraft_1.png"]},

{"name":"","category":"Astra Invictus","images":["AstraBase_2.png"]}
];
const grid=document.querySelector('.grid'),filters=document.querySelector('.filters'),dialog=document.querySelector('dialog');
const pan=document.querySelector('.image-pan'),zoomButton=document.querySelector('.zoom-image');
let activeModel,view=0,opener,drag=null,suppressClick=false;
const imgUrl=(name,preview=false)=>'assets/'+(preview?name.replace(/\.png$/,'.webp'):name);
const categories=['All','Vehicles','Aircraft','Naval','Props','Astra Invictus'];
const hasName=m=>Boolean((m.name||'').trim());
const viewerTitle=m=>hasName(m)?m.name:m.category;
const accessibleName=(m,index)=>hasName(m)?m.name:`${m.category} model ${index+1}`;
for(const category of categories){const b=document.createElement('button');b.className='filter'+(category==='All'?' active':'');b.textContent=category;b.setAttribute('aria-pressed',String(category==='All'));b.onclick=()=>{filters.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render(category)};filters.append(b)}
function render(category){grid.replaceChildren();const list=models.filter(m=>category==='All'||m.category===category);document.querySelector('.count').textContent=list.length+' models';for(const [index,m] of list.entries()){const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Explore '+accessibleName(m,index)+', '+m.images.length+' view'+(m.images.length===1?'':'s'));const wrap=document.createElement('div');wrap.className='image-wrap';const img=document.createElement('img');img.loading='lazy';img.src=imgUrl(m.images[0],true);img.alt=hasName(m)?m.name+' 3D model':m.category+' concept art';wrap.append(img);b.append(wrap);if(hasName(m)){const info=document.createElement('div');info.className='details';const title=document.createElement('h2');title.textContent=m.name;const cat=document.createElement('span');cat.textContent=m.category;info.append(title,cat);b.append(info)};b.onclick=()=>{opener=b;activeModel=m;view=0;document.querySelector('#model-title').textContent=viewerTitle(m);document.querySelector('#model-category').textContent=hasName(m)?m.category:'';update();dialog.showModal()};grid.append(b)}}
function resetZoom(){drag=null;suppressClick=false;zoomButton.classList.remove('dragging','zoomed');zoomButton.setAttribute('aria-pressed','false');zoomButton.setAttribute('aria-label','Zoom into image');pan.scrollTo(0,0)}
function update(){resetZoom();document.querySelector('#full-image').src=imgUrl(activeModel.images[view]);document.querySelector('#full-image').alt=viewerTitle(activeModel)+' — view '+(view+1);document.querySelector('.position').textContent=(view+1)+' / '+activeModel.images.length;document.querySelector('.prev').hidden=document.querySelector('.next').hidden=activeModel.images.length<2;const thumbs=document.querySelector('.thumbs');thumbs.replaceChildren();activeModel.images.forEach((src,i)=>{const b=document.createElement('button');b.className=i===view?'selected':'';b.setAttribute('aria-label','View '+(i+1));b.setAttribute('aria-pressed',String(i===view));const img=document.createElement('img');img.src=imgUrl(src,true);img.alt='';b.append(img);b.onclick=()=>{view=i;update()};thumbs.append(b)})}
function step(n){view=(view+n+activeModel.images.length)%activeModel.images.length;update()}
document.querySelector('.prev').onclick=()=>step(-1);document.querySelector('.next').onclick=()=>step(1);document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>opener?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
zoomButton.onclick=e=>{if(suppressClick){suppressClick=false;return}if(zoomButton.classList.contains('zoomed')){resetZoom();return}const r=pan.getBoundingClientRect();const x=e.detail===0?r.width/2:e.clientX-r.left,y=e.detail===0?r.height/2:e.clientY-r.top;zoomButton.classList.add('zoomed');zoomButton.setAttribute('aria-pressed','true');zoomButton.setAttribute('aria-label','Zoom out of image');pan.scrollLeft=x*2.5-r.width/2;pan.scrollTop=y*2.5-r.height/2};
zoomButton.addEventListener('pointerdown',e=>{suppressClick=false;if(e.pointerType!=='mouse'||e.button!==0||!zoomButton.classList.contains('zoomed'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:pan.scrollLeft,top:pan.scrollTop,moved:false};zoomButton.setPointerCapture(e.pointerId)});
zoomButton.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<=5)return;drag.moved=true;suppressClick=true;zoomButton.classList.add('dragging');e.preventDefault();pan.scrollLeft=drag.left-dx;pan.scrollTop=drag.top-dy});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;drag=null;zoomButton.classList.remove('dragging');if(zoomButton.hasPointerCapture(e.pointerId))zoomButton.releasePointerCapture(e.pointerId)}for(const evt of ['pointerup','pointercancel','lostpointercapture'])zoomButton.addEventListener(evt,endDrag);zoomButton.addEventListener('dragstart',e=>e.preventDefault());let startX;document.querySelector('.stage').addEventListener('touchstart',e=>startX=e.changedTouches[0].screenX,{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>50&&!zoomButton.classList.contains('zoomed'))step(dx<0?1:-1)},{passive:true});render('All');</script></html>
